[project]
name = "wikipulse"
version = "0.0.0"
description = "Daily spikes on English Wikipedia, grouped into events."
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pandera>=0.21",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyarrow>=18.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "typer>=0.15",
]

[project.scripts]
wikipulse = "wikipulse.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pip-audit>=2.9",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikipulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["slow: long-running performance and volume tests"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "joblib.*", "sklearn.*", "lightgbm.*"]
ignore_missing_imports = true
