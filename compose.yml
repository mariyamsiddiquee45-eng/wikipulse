name: wikipulse

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: wikipulse-pipeline:local
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["run-daily"]
    healthcheck:
      test: ["CMD", "/app/pipeline/.venv/bin/python", "-c", "import wikipulse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  preview:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: wikipulse-web:local
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
